- body: "Your WaniKani queue, saved the moment you answer, even offline. Forgiving where WaniKani's notation gets in the way, strict where it matters."
  reading: "ふくしゅう"
  term: "復習"
  title: "Lessons and reviews"
- body: "See the English, recall the Japanese word. A word joins once you know it forwards, at Guru, and keeps a schedule of its own."
  reading: "ぎゃくふくしゅう"
  term: "逆復習"
  title: "Reverse reviews"
- body: "Burned is not forgotten. Keep burned items in rotation on a schedule of their own, without changing anything on WaniKani."
  reading: "もえたあと"
  term: "燃えた後"
  title: "Past Burned"
- body: "Import a deck such as Kaishi 1.5k. Its words are taught, then reviewed, and step aside when WaniKani starts teaching them."
  reading: "たんごちょう"
  term: "単語帳"
  title: "Anki decks"
- body: "One reminder an hour across every queue, a forecast of what is coming, and a home-screen widget with the number that matters."
  reading: "つうち"
  term: "通知"
  title: "Reminders and a widget"
- body: "The app's own labels move into Japanese as you earn the words behind them, one term at a time, and furigana steps back once you know a word."
  reading: "にほんご"
  term: "日本語"
  title: "Japanese as you learn"
